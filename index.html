<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grand Theatre Tickets</title>
  <link rel="stylesheet" href="style.css">
  <script src="venue.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <h1>Grand Theatre</h1>
    <p>Choose your seats</p>
  </header>

  <main class="layout">
    <section id="venue" class="venue" aria-label="Venue map">
      <ul id="legend" class="legend" aria-label="Price categories"></ul>
      <div class="stage">Stage</div>
      <div id="seat-map" class="seat-map"></div>
    </section>

    <aside class="sidebar">
      <section id="seat-details" aria-live="polite">
        <h2>Seat details</h2>
        <p>Select a seat on the map to see its details.</p>
      </section>

      <section id="cart">
        <h2>Your cart</h2>
        <p>Your cart is empty.</p>
      </section>
    </aside>
  </main>
</body>
</html>
